version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform/modules/platform"
      - "/terraform/environments/dev"
      - "/terraform/environments/staging"
      - "/terraform/environments/prod"
      - "/terraform/bootstrap"
    schedule:
      interval: "weekly"